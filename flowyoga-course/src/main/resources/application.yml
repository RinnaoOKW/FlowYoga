server:
  port: 17083
  shutdown: graceful

spring:
  config:
    import: optional:file:./logs/stage2-local.properties
  datasource:
    url: ${FLOWYOGA_COURSE_DB_URL:jdbc:mysql://127.0.0.1:13306/flowyoga_course?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${FLOWYOGA_COURSE_DB_USERNAME:flowyoga_course}
    password: ${flowyoga.database.course-password:}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  application:
    name: flowyoga-course
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        ip-type: IPv4
        cluster-name: DEFAULT
        fail-fast: true
        health-indicator:
          enabled: true
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
    loadbalancer:
      nacos:
        enabled: true

flowyoga:
  security:
    jwt-secret: ${FLOWYOGA_JWT_SECRET:}
  demo:
    enabled: ${FLOWYOGA_DEMO_ENABLED:false}
  internal:
    account-token: ${FLOWYOGA_ACCOUNT_INTERNAL_TOKEN:}
    token: ${FLOWYOGA_INTERNAL_TOKEN:dev-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [rid:%X{requestId:-}] [%15.15t] %-40.40logger{39} : %m%n"
